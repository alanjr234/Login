<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    #message {
        color: red;
    }
</style>

<body>


    <form id="loginForm">

        Enter email
        <input type="email" id="email" required><br>

        Enter password
        <input type="password" id="password" required><br>

        <button type="submit">Login</button>

        <a href="signup.html" class="signup-link">
            Don't have an account? Sign up
        </a>

        <div id="message"></div>

    </form>



    <div class="message" id="message"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAP-Yf4VVIE5xHUsid1c899jukVN7pgj7A",
            authDomain: "login-16735.firebaseapp.com",
            projectId: "login-16735",
            storageBucket: "login-16735.firebasestorage.app",
            messagingSenderId: "835789368841",
            appId: "1:835789368841:web:c0d976bdf62f806ff892d8",
            measurementId: "G-GMTZD908WN"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const userCredential = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                console.log("Logged in:", userCredential.user);
                window.location.href = "home.html";

            } catch (error) {
                document.getElementById("message").innerText =
                    "Login failed: Invalid email or password";
            }
        });
    </script>

</body>
</html>
